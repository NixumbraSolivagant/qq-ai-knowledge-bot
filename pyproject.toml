[project]
name = "qq-daily-knowledge-bot"
version = "0.1.0"
description = "A NoneBot 2 QQ group bot for daily knowledge sharing"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi,httpx]>=2.4.0,<3.0.0",
    "nonebot-adapter-onebot>=2.4.0,<3.0.0",
    "nonebot-plugin-apscheduler>=0.4.0,<1.0.0",
]

[tool.nonebot]
plugin_dirs = ["plugins"]

[tool.setuptools]
packages = ["plugins"]
py-modules = ["bot"]
